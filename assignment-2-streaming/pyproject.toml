[project]
name = "nyc-taxi-streaming"
version = "1.0.0"
description = "Real-time NYC taxi pipeline: Kafka, Python stream processor, TimescaleDB, Prometheus and Grafana."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
