apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: $TIMESCALE_USER
    jsonData:
      database: $TIMESCALE_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: $TIMESCALE_PASSWORD
